<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Crea enlaces cortos y genera su código QR al instante." />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShortQR · Acortador de URLs con código QR</title>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('quickit-ui-theme')
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (theme === 'dark' || ((!theme || theme === 'system') && systemDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch {
          // Sin acceso a localStorage: se ignora
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
